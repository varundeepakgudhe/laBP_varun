description: 5 populations with hierarchical merges
time_units: generations
generation_time: 1

demes:
  - name: pop0
    start_time: 0
    epochs:
      - end_time: 1000
        start_size: 1000

  - name: pop1
    start_time: 0
    epochs:
      - end_time: 1000
        start_size: 1000

  - name: pop2
    start_time: 1000
    ancestors: [pop0, pop1]
    proportions: [0.5, 0.5]
    epochs:
      - end_time: 2000
        start_size: 2000

  - name: pop3
    start_time: 0
    epochs:
      - end_time: 2000
        start_size: 1000

  - name: pop4
    start_time: 2000
    ancestors: [pop2, pop3]
    proportions: [0.7, 0.3]
    epochs:
      - end_time: 5000
        start_size: 3000